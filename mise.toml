[tools]
python = "3.12"
uv = "latest"
node = "20"

[settings]
python.uv_venv_auto = true

[env]
_.file = ".env"

[tasks.setup]
description = "Install backend (uv sync) + frontend (npm install) dependencies"
run = """
cd backend && uv sync
cd ../web && npm install
"""

[tasks.api]
description = "Run the backend API on :6173 with auto-reload"
dir = "backend"
run = "uv run uvicorn src.api:app --reload --port 6173"

[tasks.web]
description = "Run the frontend dev server on :5173"
dir = "web"
run = "npm run dev"

[tasks.dev]
description = "Run backend + frontend together (Ctrl+C stops both)"
run = """
trap 'kill 0' EXIT INT TERM
( cd backend && uv run uvicorn src.api:app --reload --port 6173 ) &
( cd web && npm run dev ) &
wait
"""

[tasks.pipeline]
description = "Run the QBR pipeline for one account. Usage: mise run pipeline -- --account meridian"
dir = "backend"
run = "uv run python -m src.pipeline"

[tasks.test]
description = "Run backend tests"
dir = "backend"
run = "uv run pytest"

[tasks.typecheck]
description = "Frontend type check"
dir = "web"
run = "npx tsc --noEmit"
